<!-- amCharts 5 核心與文字雲套件 -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/wc.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<!-- CSS 樣式設定 -->
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
  }

  #chartdiv {
    width: 100%;
    height: 500px;
  }
</style>

<!-- 圖表容器 -->
<div id="chartdiv"></div>

<!-- JS 邏輯處理 -->
<script>
  am5.ready(function() {
    var root = am5.Root.new("chartdiv");

    root.setThemes([
      am5themes_Animated.new(root)
    ]);

    // Head in profile, facing right. Drawn in a 250x250 box; the series scales it
    // to the plot area.
    var headPath = "M 120 15 C 176 15 216 56 217 105 C 218 116 215 125 216 126 C 219 137 228 148 229 154 C 230 158 226 161 219 163 C 213 163 210 165 210 171 C 221 183 205 187 206 193 C 203 204 201 209 200 213 L 166 213 L 166 236 L 62 236 C 62 162 35 197 24 110 C 20 58 64 15 120 15 Z";

    root.container.setAll({
      paddingTop: 20,
      paddingBottom: 20,
      paddingLeft: 20,
      paddingRight: 20
    });

    var series = root.container.children.push(
      am5wc.WordCloud.new(root, {
        categoryField: "tag",
        valueField: "weight",
        svgPath: headPath,
        shapeTolerance: 20,
        angles: [0, 90],
        sequencedInterpolation: false,
        randomizeAngles: true,
        minFontSize: am5.percent(1),
        maxFontSize: am5.percent(16)
      })
    );

    series.shape.setAll({
      strokeWidth: 10,
      nonScalingStroke: true,
      stroke: am5.color(0x000000)
    });

    series.labels.template.setAll({
      fontWeight: "500",
      tooltipText: "{category}: {value}"
    });

    series.data.setAll([
      { tag: "Sleep", weight: 200 },
      { tag: "Quality", weight: 190 },
      { tag: "Disorder", weight: 185 },
      { tag: "Stress", weight: 180 },
      { tag: "Rested", weight: 180 },
      { tag: "Caffeine", weight: 175 },
      { tag: "Deep", weight: 170 },
      { tag: "Anxiety", weight: 165 },
      { tag: "Depression", weight: 160 },
      { tag: "Latency", weight: 160 },
      { tag: "Mental", weight: 155 },
      { tag: "REM", weight: 150 },
      { tag: "Screen", weight: 150 },
      { tag: "Chronotype", weight: 150 },
      { tag: "Exercise", weight: 145 },
      { tag: "Age", weight: 140 },
      { tag: "Cognition", weight: 140 },
      { tag: "Work", weight: 135 },
      { tag: "Gender", weight: 130 },
      { tag: "Alcohol", weight: 130 },
      { tag: "Shift", weight: 125 },
      { tag: "BMI", weight: 120 },
      { tag: "Steps", weight: 115 },
      { tag: "Occupation", weight: 110 },
      { tag: "Heartrate", weight: 110 },
      { tag: "Sociallag", weight: 105 },
      { tag: "Aid", weight: 100 },
      { tag: "Day", weight: 95 },
      { tag: "Nap", weight: 90 },
      { tag: "Temperature", weight: 85 },
      { tag: "Country", weight: 80 },
      { tag: "Season", weight: 75 },
      { tag: "Flexibility", weight: 40 },
      { tag: "Environment", weight: 5 }
    ]);
  });
</script>
